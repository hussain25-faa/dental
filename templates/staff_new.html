<div class="card">
  <h1>New Staff</h1>
  {{error_html}}
  <form method="post" action="/staff/new" enctype="multipart/form-data">
    <div class="row">
      <div>
        <label>Staff Name</label>
        <input type="text" name="name" required />
      </div>
      <div>
        <label>Phone number</label>
        <input type="text" name="phone" />
      </div>
      <div>
        <label>Role</label>
        <input type="text" name="role" placeholder="Staff or Receptionist" required />
      </div>
    </div>
    <div class="row">
      <div>
        <label>Address</label>
        <input type="text" name="address" />
      </div>
      <div>
        <label>Aadhaar No</label>
        <input type="text" name="aadhar_no" />
      </div>
    </div>
    <div class="row">
      <div>
        <label>Staff Image</label>
        <input type="file" name="staff_image" accept="image/*" />
      </div>
      <div>
        <label>Aadhaar Image</label>
        <input type="file" name="aadhar_image" accept="image/*" />
      </div>
    </div>
    <div class="row">
      <div style="flex:1 1 200px">
        <label>&nbsp;</label>
        <button class="btn good" type="submit">Create</button>
      </div>
      <div style="flex:1 1 200px">
        <label>&nbsp;</label>
        <a class="btn secondary" href="/staff">Cancel</a>
      </div>
    </div>
  </form>
</div>
