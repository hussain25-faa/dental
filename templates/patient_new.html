<div class="card">
  <div class="headrow">
    <div class="left">
      <h1>New Patient</h1>
      <div class="subhead">Add patient details with cleaner spacing and faster entry</div>
    </div>
  </div>
  <div style="height:12px"></div>
  {{error_html}}
  <form method="post" action="/patients/new">
    <div class="row">
      <div>
        <label>Patient Name</label>
        <input type="text" name="name" required />
      </div>
      <div>
        <label>Age</label>
        <input type="number" name="age" min="0" max="130" />
      </div>
      <div>
        <label>Gender</label>
        <select name="gender">
          <option value="">Select</option>
          <option>Male</option>
          <option>Female</option>
          <option>Other</option>
        </select>
      </div>
    </div>
    <div class="row">
      <div>
        <label>Phone Number</label>
        <input type="text" name="phone" />
      </div>
    </div>
    <div class="form-actions">
      <button class="btn good" type="submit">Create Patient</button>
      <a class="btn secondary" href="/patients">Cancel</a>
    </div>
  </form>
</div>
